name: Deploy Supermapas landing

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch approved landing snapshot
        run: |
          mkdir -p public
          curl --fail --location --retry 4 --retry-delay 2 \
            'https://qzrkgekzfbmsghudxkmd.supabase.co/functions/v1/supermapas-wix-package' \
            -o public/index.html

      - name: Validate landing bundle
        run: |
          test $(wc -c < public/index.html) -gt 300000
          grep -q 'sm-section-nav' public/index.html
          grep -q 'sm-sales-dock' public/index.html
          grep -q '98 Supermapas + 50 Super-Resumos + 190 Supercards' public/index.html
          grep -q 'Quem está por trás' public/index.html
          touch public/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
