name: Deploy Supermapas landing

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore approved hydrated React bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p public /tmp/sm-approved
          curl --fail --location --retry 4 --retry-delay 2 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9548938058/zip" \
            -o /tmp/sm-approved/github-pages.zip
          unzip -o /tmp/sm-approved/github-pages.zip -d /tmp/sm-approved/artifact
          test -f /tmp/sm-approved/artifact/artifact.tar
          tar -xf /tmp/sm-approved/artifact/artifact.tar -C public

      - name: Apply approved Wix patches
        run: |
          python - <<'PY'
          from pathlib import Path

          # Rebase approved artifact to custom-domain root.
          for path in Path('public').rglob('*'):
              if not path.is_file():
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if '/supermapas-landing' in text:
                  path.write_text(text.replace('/supermapas-landing', ''), encoding='utf-8')

          # FAQ wording.
          old_faq = 'O que está incluído no acesso?'
          new_faq = 'O que está incluso no acesso?'
          changed = 0
          for path in Path('public').rglob('*'):
              if not path.is_file() or path.suffix.lower() not in {'.html','.js','.json','.txt','.css'}:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              n = text.count(old_faq)
              if n:
                  path.write_text(text.replace(old_faq,new_faq), encoding='utf-8')
                  changed += n
          if changed < 1:
              raise SystemExit('FAQ anchor missing')

          # Approved React behavior patches.
          js_path = Path('public/_next/static/chunks/0cnqcucz7h_pk.js')
          js = js_path.read_text(encoding='utf-8')
          old = '},[e,S,j,w]);(0,r.useEffect)(()=>{let e=x();'
          new = '},[e,S,j,w]);(0,r.useEffect)(()=>{try{"wix"===new URLSearchParams(location.search).get("embed")&&j()}catch(e){}},[j]);(0,r.useEffect)(()=>{let e=x();'
          if js.count(old) != 1:
              raise SystemExit('nav label anchor mismatch')
          js = js.replace(old,new,1)
          old = 'let r=t.matches&&(o||c||d);'
          new = 'let r=t.matches&&o;'
          if js.count(old) != 1:
              raise SystemExit('sticky dock anchor mismatch')
          js = js.replace(old,new,1)
          js_path.write_text(js, encoding='utf-8')

          # Approved mobile rail geometry only.
          css_path = Path('public/_next/static/chunks/3qg_tgjt67qum.css')
          css = css_path.read_text(encoding='utf-8')
          reps = [
              ('@media (max-width:700px){.sm-section-nav{z-index:185;right:0;touch-action:none!important}',
               '@media (max-width:700px){.sm-section-nav{z-index:185;right:-8px;touch-action:none!important}'),
              ('.sm-section-nav-rail{width:48px;height:min(50vh,380px);min-height:290px;touch-action:none!important}',
               '.sm-section-nav-rail{width:34px;height:min(50vh,380px);min-height:290px;touch-action:none!important}'),
              ('.sm-section-nav.is-dragging .sm-section-nav-rail{width:58px}',
               '.sm-section-nav.is-dragging .sm-section-nav-rail{width:40px}'),
          ]
          for old,new in reps:
              if css.count(old) != 1:
                  raise SystemExit('rail CSS anchor mismatch: '+old)
              css = css.replace(old,new,1)
          css_path.write_text(css, encoding='utf-8')

          index = Path('public/index.html')
          html = index.read_text(encoding='utf-8')

          # Safari/Wix fix for the three audience illustrations, deferred until after
          # the initial page load so below-the-fold assets do not compete with the hero.
          audience = r'''<script id="sm-wix-audience-eager">(function(){try{if(new URLSearchParams(location.search).get('embed')!=='wix')return;var done=false;function force(){if(done)return;done=true;document.querySelectorAll('.sm-audience-use-visual img').forEach(function(img){try{img.removeAttribute('loading');img.loading='eager';img.fetchPriority='low';var src=img.getAttribute('src');if(src&&!img.complete)img.src=src;if(img.decode)img.decode().catch(function(){})}catch(_){}})}function schedule(){setTimeout(force,350)}if(document.readyState==='complete')schedule();else window.addEventListener('load',schedule,{once:true});setTimeout(force,2200)}catch(_){}})();</script>'''

          # In Wix, preserve the original landing context on iOS and Meta in-app browsers.
          # Their BFCache/WebView restore can freeze the transformed iframe after returning
          # from Hotmart. A direct user-gesture window.open keeps the landing alive behind
          # checkout. If opening a new context is blocked, fall back to parent navigation.
          bridge = r'''<script id="sm-wix-embed-nav">(function(){try{var q=new URLSearchParams(location.search);if(q.get('embed')!=='wix')return;var PARENT='https://www.supermapas.com.br';var PRESERVE_CHECKOUT_CONTEXT=/iPad|iPhone|iPod|Instagram|FBAN|FBAV|FB_IAB|FB4A|FBMD/i.test(navigator.userAgent||'');function classify(a){if(!a||!a.href)return null;try{var u=new URL(a.href,location.href);if(u.hostname==='pay.hotmart.com'||u.hostname.endsWith('.hotmart.com'))return{kind:'checkout',url:u.href};if(u.hostname==='wa.me')return{kind:'external',url:u.href};return null}catch(_){return null}}document.querySelectorAll('a[href]').forEach(function(a){var x=classify(a);if(x&&x.kind==='external')a.setAttribute('target','_top')});document.addEventListener('click',function(e){var n=e.target;var a=n&&n.closest?n.closest('a[href]'):null;var x=classify(a);if(!x)return;if(x.kind==='external'){a.setAttribute('target','_top');return}if(x.kind==='checkout'){e.preventDefault();e.stopPropagation();if(PRESERVE_CHECKOUT_CONTEXT){try{var w=window.open(x.url,'_blank');if(w){try{w.opener=null}catch(_){}return}}catch(_){}}try{if(window.top!==window){parent.postMessage({type:'sm-hotmart-checkout',href:x.url,source:'supermapas-landing'},PARENT);return}}catch(_){}location.href=x.url}},true)}catch(_){}})();</script>'''
          if '</body>' not in html:
              raise SystemExit('closing body missing')
          html = html.replace('</body>', audience + bridge + '</body>', 1)
          index.write_text(html, encoding='utf-8')
          PY

      - name: Validate landing bundle
        run: |
          test -f public/index.html
          test $(wc -c < public/index.html) -gt 20000
          grep -q 'sm-section-nav' public/index.html
          grep -q '/_next/static/' public/index.html
          ! grep -R -q '/supermapas-landing' public
          grep -q 'sm-wix-audience-eager' public/index.html
          grep -q "fetchPriority='low'" public/index.html
          grep -q 'setTimeout(force,2200)' public/index.html
          ! grep -q 'sm-wix-image-stabilizer' public/index.html
          grep -q 'sm-wix-embed-nav' public/index.html
          grep -q 'PRESERVE_CHECKOUT_CONTEXT' public/index.html
          grep -Fq "window.open(x.url,'_blank')" public/index.html
          grep -q 'sm-hotmart-checkout' public/index.html
          grep -q 'window.top!==window' public/index.html
          ! grep -q 'window.top.location.href=href' public/index.html
          grep -q 'O que está incluso no acesso?' public/index.html
          ! grep -R -q 'O que está incluído no acesso?' public
          grep -q 'URLSearchParams(location.search).get("embed")&&j()' public/_next/static/chunks/0cnqcucz7h_pk.js
          grep -Fq 'let r=t.matches&&o;' public/_next/static/chunks/0cnqcucz7h_pk.js
          grep -Fq 'right:-8px;touch-action:none!important' public/_next/static/chunks/3qg_tgjt67qum.css
          grep -Fq '.sm-section-nav-rail{width:34px;height:min(50vh,380px)' public/_next/static/chunks/3qg_tgjt67qum.css
          grep -Fq '.sm-section-nav.is-dragging .sm-section-nav-rail{width:40px}' public/_next/static/chunks/3qg_tgjt67qum.css
          grep -R -q 'setPointerCapture' public/_next/static
          grep -R -q 'IntersectionObserver' public/_next/static
          touch public/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
