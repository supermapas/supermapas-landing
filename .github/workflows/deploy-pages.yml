name: Deploy Supermapas landing

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore approved hydrated React bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p public /tmp/sm-approved
          curl --fail --location --retry 4 --retry-delay 2 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9548938058/zip" \
            -o /tmp/sm-approved/github-pages.zip
          unzip -o /tmp/sm-approved/github-pages.zip -d /tmp/sm-approved/artifact
          test -f /tmp/sm-approved/artifact/artifact.tar
          tar -xf /tmp/sm-approved/artifact/artifact.tar -C public

      - name: Rebase compiled bundle to custom-domain root
        run: |
          grep -RIlZ '/supermapas-landing' public | xargs -0 -r sed -i 's#/supermapas-landing##g'

      - name: Change FAQ wording to incluso
        run: |
          python - <<'PY'
          from pathlib import Path

          old = 'O que está incluído no acesso?'
          new = 'O que está incluso no acesso?'
          replacements = 0
          for path in Path('public').rglob('*'):
              if not path.is_file() or path.suffix.lower() not in {'.html', '.js', '.json', '.txt', '.css'}:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              count = text.count(old)
              if count:
                  path.write_text(text.replace(old, new), encoding='utf-8')
                  replacements += count
          if replacements < 1:
              raise SystemExit('FAQ question was not found in compiled bundle')
          print(f'FAQ replacements: {replacements}')
          PY

      - name: Match initial section label timing in Wix embed
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('public/_next/static/chunks/0cnqcucz7h_pk.js')
          js = path.read_text(encoding='utf-8')
          old = '},[e,S,j,w]);(0,r.useEffect)(()=>{let e=x();'
          new = '},[e,S,j,w]);(0,r.useEffect)(()=>{try{"wix"===new URLSearchParams(location.search).get("embed")&&j()}catch(e){}},[j]);(0,r.useEffect)(()=>{let e=x();'
          if js.count(old) != 1:
              raise SystemExit(f'expected one section-nav lifecycle anchor, found {js.count(old)}')
          js = js.replace(old, new, 1)
          path.write_text(js, encoding='utf-8')
          PY

      - name: Add Wix embed external navigation bridge
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('public/index.html')
          html = path.read_text(encoding='utf-8')
          bridge = r'''<script id="sm-wix-embed-nav">(function(){try{var q=new URLSearchParams(location.search);if(q.get('embed')!=='wix')return;var PARENT='https://www.supermapas.com.br';function classify(a){if(!a||!a.href)return null;try{var u=new URL(a.href,location.href);if(u.hostname==='pay.hotmart.com'||u.hostname.endsWith('.hotmart.com'))return{kind:'checkout',url:u.href};if(u.hostname==='wa.me')return{kind:'external',url:u.href};return null}catch(_){return null}}document.querySelectorAll('a[href]').forEach(function(a){var x=classify(a);if(x&&x.kind==='external')a.setAttribute('target','_top')});document.addEventListener('click',function(e){var n=e.target;var a=n&&n.closest?n.closest('a[href]'):null;var x=classify(a);if(!x)return;if(x.kind==='external'){a.setAttribute('target','_top');return}if(x.kind==='checkout'){e.preventDefault();e.stopPropagation();try{parent.postMessage({type:'sm-hotmart-checkout',href:x.url,source:'supermapas-landing'},PARENT)}catch(_){}var href=x.url;setTimeout(function(){try{window.top.location.href=href}catch(_){location.href=href}},1200)}},true)}catch(_){}})();</script>'''
          if 'id="sm-wix-embed-nav"' not in html:
              if '</body>' not in html:
                  raise SystemExit('closing body tag missing')
              html = html.replace('</body>', bridge + '</body>', 1)
              path.write_text(html, encoding='utf-8')
          PY

      - name: Force audience illustrations in Wix iframe
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('public/index.html')
          html = path.read_text(encoding='utf-8')
          script = r'''<script id="sm-wix-audience-eager">(function(){try{if(new URLSearchParams(location.search).get('embed')!=='wix')return;function force(){document.querySelectorAll('.sm-audience-use-visual img').forEach(function(img){try{img.removeAttribute('loading');img.loading='eager';img.fetchPriority='high';var src=img.getAttribute('src');if(src&&!img.complete){img.src=src}if(img.decode)img.decode().catch(function(){})}catch(_){}})}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',force,{once:true});else force();setTimeout(force,250);setTimeout(force,1200)}catch(_){}})();</script>'''
          if 'id="sm-wix-audience-eager"' not in html:
              if '</body>' not in html:
                  raise SystemExit('closing body tag missing')
              html = html.replace('</body>', script + '</body>', 1)
              path.write_text(html, encoding='utf-8')
          PY

      - name: Refine mobile section rail and sticky dock
        run: |
          python - <<'PY'
          from pathlib import Path

          js_path = Path('public/_next/static/chunks/0cnqcucz7h_pk.js')
          js = js_path.read_text(encoding='utf-8')
          old_js = 'let r=t.matches&&(o||c||d);'
          new_js = 'let r=t.matches&&o;'
          if js.count(old_js) != 1:
              raise SystemExit(f'expected one sticky dock suppression anchor, found {js.count(old_js)}')
          js_path.write_text(js.replace(old_js, new_js, 1), encoding='utf-8')

          css_path = Path('public/_next/static/chunks/3qg_tgjt67qum.css')
          css = css_path.read_text(encoding='utf-8')
          replacements = [
              ('@media (max-width:700px){.sm-section-nav{z-index:185;right:0;touch-action:none!important}',
               '@media (max-width:700px){.sm-section-nav{z-index:185;right:-12px;touch-action:none!important}'),
              ('.sm-section-nav-rail{width:48px;height:min(50vh,380px);min-height:290px;touch-action:none!important}',
               '.sm-section-nav-rail{width:34px;height:min(50vh,380px);min-height:290px;touch-action:none!important}'),
              ('.sm-section-nav.is-dragging .sm-section-nav-rail{width:58px}',
               '.sm-section-nav.is-dragging .sm-section-nav-rail{width:40px}'),
          ]
          for old_css, new_css in replacements:
              if css.count(old_css) != 1:
                  raise SystemExit(f'expected one mobile section-nav CSS anchor, found {css.count(old_css)} for {old_css}')
              css = css.replace(old_css, new_css, 1)
          css_path.write_text(css, encoding='utf-8')
          PY

      - name: Add temporary Wix performance probe
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('public/index.html')
          html = path.read_text(encoding='utf-8')
          probe = r'''<script id="sm-wix-perf-v31">(function(){try{var q=new URLSearchParams(location.search);if(q.get('embed')!=='wix'||q.get('perf')!=='31')return;var PARENT='https://www.supermapas.com.br',lcp=0,cls=0;try{new PerformanceObserver(function(list){var e=list.getEntries();if(e.length){var x=e[e.length-1];lcp=x.startTime||x.renderTime||0}}).observe({type:'largest-contentful-paint',buffered:true})}catch(_){}try{new PerformanceObserver(function(list){list.getEntries().forEach(function(e){if(!e.hadRecentInput)cls+=e.value||0})}).observe({type:'layout-shift',buffered:true})}catch(_){}function send(stage){try{var nav=performance.getEntriesByType('navigation')[0]||{},res=performance.getEntriesByType('resource')||[],transfer=0,encoded=0,decoded=0,hosts={};res.forEach(function(r){transfer+=r.transferSize||0;encoded+=r.encodedBodySize||0;decoded+=r.decodedBodySize||0;try{var h=new URL(r.name).hostname;hosts[h]=(hosts[h]||0)+1}catch(_){}});parent.postMessage({type:'sm-landing-perf-v31',metrics:{stage:stage,ts:new Date().toISOString(),href:location.href,innerWidth:innerWidth,innerHeight:innerHeight,ttfbMs:Math.round(nav.responseStart||0),domContentLoadedMs:Math.round(nav.domContentLoadedEventEnd||0),loadMs:Math.round(nav.loadEventEnd||0),lcpMs:Math.round(lcp||0),cls:Math.round(cls*10000)/10000,resourceCount:res.length,transferBytes:transfer,encodedBytes:encoded,decodedBytes:decoded,hostCounts:hosts}},PARENT)}catch(_){}}window.addEventListener('load',function(){setTimeout(function(){send('load')},100)},{once:true});setTimeout(function(){send('final')},7000)}catch(_){}})();</script>'''
          if 'id="sm-wix-perf-v31"' not in html:
              if '</body>' not in html:
                  raise SystemExit('closing body tag missing')
              html = html.replace('</body>', probe + '</body>', 1)
              path.write_text(html, encoding='utf-8')
          PY

      - name: Validate hydrated landing bundle
        run: |
          test -f public/index.html
          test $(wc -c < public/index.html) -gt 20000
          grep -q 'sm-section-nav' public/index.html
          grep -q '/_next/static/' public/index.html
          ! grep -R -q '/supermapas-landing' public
          grep -q 'fundador dos SuperMapas' public/index.html
          grep -q 'história dos SuperMapas' public/index.html
          grep -q 'dos SuperMapas.' public/index.html
          grep -q 'sm-wix-embed-nav' public/index.html
          grep -q 'sm-hotmart-checkout' public/index.html
          grep -q 'sm-wix-audience-eager' public/index.html
          grep -q 'sm-wix-perf-v31' public/index.html
          grep -q 'O que está incluso no acesso?' public/index.html
          ! grep -R -q 'O que está incluído no acesso?' public
          grep -q 'URLSearchParams(location.search).get("embed")&&j()' public/_next/static/chunks/0cnqcucz7h_pk.js
          grep -Fq 'let r=t.matches&&o;' public/_next/static/chunks/0cnqcucz7h_pk.js
          grep -Fq 'right:-12px;touch-action:none!important' public/_next/static/chunks/3qg_tgjt67qum.css
          grep -Fq '.sm-section-nav-rail{width:34px;height:min(50vh,380px)' public/_next/static/chunks/3qg_tgjt67qum.css
          grep -Fq '.sm-section-nav.is-dragging .sm-section-nav-rail{width:40px}' public/_next/static/chunks/3qg_tgjt67qum.css
          grep -R -q 'sm-sales-dock' public/_next/static
          grep -R -q 'setPointerCapture' public/_next/static
          grep -R -q 'IntersectionObserver' public/_next/static
          grep -R -q 'Segoe UI' public/_next/static
          touch public/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
