name: Deploy Supermapas landing

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch hydrated React bundle
        run: |
          mkdir -p public /tmp/sm-react
          curl --fail --location --retry 4 --retry-delay 2 \
            'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-ed54-820e-921e-8e8ea42b91c5/raw?se=2026-08-25T04%3A22%3A38Z&sp=r&sv=2026-02-06&sr=b&scid=0ba2e5e2-77ed-53d6-8841-1714a7d630e6&skoid=68f37fa7-4e08-478b-93f3-c72d563a0ab3&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-24T22%3A54%3A33Z&ske=2026-08-25T22%3A54%3A33Z&sks=b&skv=2026-02-06&sig=DjlfS8cUbonVwxaOKYgdMfp%2Fop6faiM1CihF7qCk2AU%3D' \
            -o /tmp/sm-react/artifact.zip
          unzip -o /tmp/sm-react/artifact.zip -d /tmp/sm-react/artifact
          tar -xzf /tmp/sm-react/artifact/supermapas-react-pages.tar.gz -C public

      - name: Rebase compiled bundle to custom-domain root
        run: |
          grep -RIlZ '/supermapas-landing' public | xargs -0 -r sed -i 's#/supermapas-landing##g'

      - name: Validate hydrated landing bundle
        run: |
          test -f public/index.html
          test $(wc -c < public/index.html) -gt 20000
          grep -q 'sm-section-nav' public/index.html
          grep -q '/_next/static/' public/index.html
          ! grep -R -q '/supermapas-landing' public
          grep -q 'fundador dos SuperMapas' public/index.html
          grep -q 'história dos SuperMapas' public/index.html
          grep -q 'dos SuperMapas.' public/index.html
          grep -R -q 'sm-sales-dock' public/_next/static
          grep -R -q 'setPointerCapture' public/_next/static
          grep -R -q 'IntersectionObserver' public/_next/static
          grep -R -q 'Segoe UI' public/_next/static
          touch public/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
