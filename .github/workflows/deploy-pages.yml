name: Deploy Supermapas landing

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch hydrated React bundle
        run: |
          mkdir -p public /tmp/sm-react
          curl --fail --location --retry 4 --retry-delay 2 \
            'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-d974-820e-84d8-379ec21ae4fe/raw?se=2026-08-25T04%3A17%3A56Z&sp=r&sv=2026-02-06&sr=b&scid=d164dce1-08c3-5a83-a4ab-24c49207a68c&skoid=68f37fa7-4e08-478b-93f3-c72d563a0ab3&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-24T22%3A52%3A35Z&ske=2026-08-25T22%3A52%3A35Z&sks=b&skv=2026-02-06&sig=wH96UbFq9P9rhTak8PPZCEm08muIvMdn72Q8pjDSios%3D' \
            -o /tmp/sm-react/artifact.zip
          unzip -o /tmp/sm-react/artifact.zip -d /tmp/sm-react/artifact
          tar -xzf /tmp/sm-react/artifact/supermapas-react-pages.tar.gz -C public

      - name: Validate hydrated landing bundle
        run: |
          test -f public/index.html
          test $(wc -c < public/index.html) -gt 20000
          grep -q 'sm-section-nav' public/index.html
          grep -q '/supermapas-landing/_next/static/' public/index.html
          grep -R -q 'sm-sales-dock' public/_next/static
          grep -R -q 'setPointerCapture' public/_next/static
          grep -R -q 'IntersectionObserver' public/_next/static
          grep -R -q 'Segoe UI' public/_next/static
          touch public/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
