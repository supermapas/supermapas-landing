name: Deploy Supermapas landing

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore approved hydrated React bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p public /tmp/sm-approved
          curl --fail --location --retry 4 --retry-delay 2 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9548938058/zip" \
            -o /tmp/sm-approved/github-pages.zip
          unzip -o /tmp/sm-approved/github-pages.zip -d /tmp/sm-approved/artifact
          test -f /tmp/sm-approved/artifact/artifact.tar
          tar -xf /tmp/sm-approved/artifact/artifact.tar -C public

      - name: Rebase compiled bundle to custom-domain root
        run: |
          grep -RIlZ '/supermapas-landing' public | xargs -0 -r sed -i 's#/supermapas-landing##g'

      - name: Add Wix embed external navigation bridge
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('public/index.html')
          html = path.read_text(encoding='utf-8')
          bridge = r'''<script id="sm-wix-embed-nav">(function(){try{var q=new URLSearchParams(location.search);if(q.get('embed')!=='wix')return;function externalTop(a){if(!a||!a.href)return;try{var u=new URL(a.href,location.href);if(u.hostname==='pay.hotmart.com'||u.hostname==='wa.me'||u.hostname.endsWith('.hotmart.com'))a.setAttribute('target','_top')}catch(_){}}document.querySelectorAll('a[href]').forEach(externalTop);document.addEventListener('click',function(e){var n=e.target;var a=n&&n.closest?n.closest('a[href]'):null;externalTop(a)},true)}catch(_){}})();</script>'''
          if 'id="sm-wix-embed-nav"' not in html:
              if '</body>' not in html:
                  raise SystemExit('closing body tag missing')
              html = html.replace('</body>', bridge + '</body>', 1)
              path.write_text(html, encoding='utf-8')
          PY

      - name: Validate hydrated landing bundle
        run: |
          test -f public/index.html
          test $(wc -c < public/index.html) -gt 20000
          grep -q 'sm-section-nav' public/index.html
          grep -q '/_next/static/' public/index.html
          ! grep -R -q '/supermapas-landing' public
          grep -q 'fundador dos SuperMapas' public/index.html
          grep -q 'história dos SuperMapas' public/index.html
          grep -q 'dos SuperMapas.' public/index.html
          grep -q 'sm-wix-embed-nav' public/index.html
          grep -R -q 'sm-sales-dock' public/_next/static
          grep -R -q 'setPointerCapture' public/_next/static
          grep -R -q 'IntersectionObserver' public/_next/static
          grep -R -q 'Segoe UI' public/_next/static
          touch public/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
