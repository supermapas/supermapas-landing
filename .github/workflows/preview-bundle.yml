name: Validate production-ready landing bundle

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-preview-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Start from current approved Production bundle
        run: |
          test -f vercel-static/index.html
          rm -rf public
          cp -a vercel-static public

      - name: Normalize every Hotmart CTA to checkout mode 10
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('public')
          target = 'https://pay.hotmart.com/A92093667Q?off=ia91gsts&checkoutMode=10'
          sources = (
              'https://pay.hotmart.com/A92093667Q?checkoutMode=2&off=ia91gsts',
              'https://pay.hotmart.com/A92093667Q?checkoutMode=10',
          )
          replaced = 0
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in {'.html','.js','.json','.txt'}:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              original = text
              for old in sources:
                  count = text.count(old)
                  if count:
                      text = text.replace(old, target)
                      replaced += count
              if text != original:
                  path.write_text(text, encoding='utf-8')
          if replaced < 1:
              raise SystemExit('No Hotmart checkout URLs were replaced')
          print(f'Hotmart checkout URLs normalized: {replaced}')
          PY

      - name: Validate checkout URLs
        run: |
          grep -Fq 'https://pay.hotmart.com/A92093667Q?off=ia91gsts&checkoutMode=10' public/index.html
          ! grep -R -q 'checkoutMode=2' public
          grep -Fq 'sm-dock-checkout' public/index.html
          grep -Fq 'sm-checkout-attribution' public/index.html
          grep -Fq '261169597067924' public/index.html

      - name: Materialize checkout test bundle
        env:
          PREVIEW_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          rm -rf vercel-static
          cp -a public vercel-static
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vercel-static
          if git diff --cached --quiet; then
            echo "Checkout test bundle already materialized"
            exit 0
          fi
          git commit -m "Materialize Hotmart checkout mode 10 preview"
          git push origin "HEAD:${PREVIEW_BRANCH}"
