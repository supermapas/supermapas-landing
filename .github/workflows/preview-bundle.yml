name: Validate sales conversion v2 preview

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-preview-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Start from current approved Production bundle
        run: |
          test -f vercel-static/index.html
          rm -rf public
          cp -a vercel-static public

      - name: Apply sales conversion v2 carousels
        run: python scripts/apply-aggressive-sales-v2.py

      - name: Apply aggressive marketing v2
        run: python scripts/apply-aggressive-marketing-v2.py

      - name: Apply visual before-after comparison
        run: python scripts/apply-visual-comparison-v2.py

      - name: Validate sales conversion v2 preview
        run: |
          grep -Fq 'data-sm-carousel="maps"' public/index.html
          grep -Fq 'data-sm-carousel="summaries"' public/index.html
          grep -Fq 'data-sm-carousel="cards"' public/index.html
          grep -Fq 'data-sm-carousel-slide="7"' public/index.html
          grep -Fq '1a67b8_b19132c7753849e08a076d81791245a4~mv2.png/v1/fit/w_1200,h_848/file.webp' public/index.html
          ! grep -Fq 'id="amostras"' public/index.html
          ! grep -Fq 'href="#amostras"' public/index.html
          grep -Fq 'QUERO DOMINAR PORTUGUÊS' public/index.html
          grep -Fq 'BÔNUS 1' public/index.html
          grep -Fq 'BÔNUS 2' public/index.html
          grep -Fq '98 SUPERMAPAS + 2 BÔNUS' public/index.html
          grep -Fq 'data-sm-before-after' public/index.html
          grep -Fq 'sm-visual-compare-v2' public/index.html
          grep -Fq 'https://pay.hotmart.com/A92093667Q?off=ia91gsts&checkoutMode=10' public/index.html
          grep -Fq '261169597067924' public/index.html

      - name: Materialize sales conversion v2 preview
        env:
          PREVIEW_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          rm -rf vercel-static
          cp -a public vercel-static
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vercel-static
          if git diff --cached --quiet; then
            echo "Sales conversion preview already materialized"
            exit 0
          fi
          git commit -m "Materialize sales conversion v2 preview"
          git push origin "HEAD:${PREVIEW_BRANCH}"
